<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrickBuilder 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "three": "https://esm.sh/three@0.154.0",
            "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
            "@react-three/drei": "https://esm.sh/@react-three/drei@9.74.0?external=react,react-dom,three,@react-three/fiber",
            "three/addons/exporters/STLExporter.js": "https://esm.sh/three@0.154.0/examples/jsm/exporters/STLExporter.js",
            "three/addons/exporters/OBJExporter.js": "https://esm.sh/three@0.154.0/examples/jsm/exporters/OBJExporter.js",
            "three/addons/utils/BufferGeometryUtils.js": "https://esm.sh/three@0.154.0/examples/jsm/utils/BufferGeometryUtils.js"
        }
    }
    </script>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
        #root { width: 100%; height: 100%; }
        canvas { touch-action: none; }
        .safe-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useEffect, useMemo, useRef, useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Canvas, useThree, useFrame } from '@react-three/fiber';
        import { OrbitControls, RoundedBox, Environment } from '@react-three/drei';
        import * as THREE from 'three';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';
        import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
        import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

        const GRID_SIZE = 24;
        const MIN_TOUCH = 'min-w-[44px] min-h-[44px]';
        const MATERIAL_TYPES = ['plastic', 'wood', 'metal'];
        const PALETTE = ['#ef4444','#3b82f6','#eab308','#22c55e','#f8fafc','#475569','#0f172a','#db2777','#f97316','#a855f7','#78350f','#bae6fd'];
        const createId = () => (crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));

        const Icons = {
            Move: () => '✥', Build: () => '⬛', Delete: () => '🗑', Undo: () => '↶', Redo: () => '↷',
            Save: () => '💾', Load: () => '📂', Shot: () => '📸', Punch: () => '👊', Start: () => '🚀'
        };

        let audioCtx = null;
        let masterGain = null;
        const impactBufferCache = {};

        const getAudio = () => {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!audioCtx) {
                audioCtx = new AC();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.45;
                masterGain.connect(audioCtx.destination);
            }
            return { ctx: audioCtx, out: masterGain };
        };

        const getImpactBuffer = (ctx) => {
            if (impactBufferCache[ctx.sampleRate]) return impactBufferCache[ctx.sampleRate];
            const duration = 0.1;
            const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length / 4));
            impactBufferCache[ctx.sampleRate] = buffer;
            return buffer;
        };

        const playImpactSound = (material, enabled, distanceFactor = 1) => {
            if (!enabled) return;
            const audio = getAudio();
            if (!audio) return;
            const { ctx, out } = audio;
            if (ctx.state === 'suspended') ctx.resume();

            const source = ctx.createBufferSource();
            source.buffer = getImpactBuffer(ctx);
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();
            const profile = {
                plastic: { freq: 1300, q: 4, amp: 0.012 },
                wood: { freq: 620, q: 1.5, amp: 0.017 },
                metal: { freq: 2200, q: 8, amp: 0.01 }
            }[material] || { freq: 1000, q: 3, amp: 0.012 };

            const now = ctx.currentTime;
            const duration = 0.1;
            filter.type = 'bandpass';
            filter.frequency.value = profile.freq;
            filter.Q.value = profile.q;
            gain.gain.value = profile.amp * Math.max(0.3, Math.min(1, 1 / distanceFactor));
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            source.connect(filter);
            filter.connect(gain);
            gain.connect(out);
            source.start(now);
            source.stop(now + duration);
        };

        const UIButton = ({ label, onClick, active, icon, disabled }) => (
            <button
                onClick={onClick}
                disabled={disabled}
                className={`${MIN_TOUCH} px-3 py-2 rounded-xl text-sm font-semibold border transition ${active ? 'bg-blue-600 text-white border-blue-500' : 'bg-white/95 text-slate-700 border-slate-200'} ${disabled ? 'opacity-50 cursor-not-allowed' : 'hover:scale-[1.02]'}`}
                title={label}
            >
                <span className="inline-flex items-center gap-2"><span>{icon ? icon() : ''}</span>{label}</span>
            </button>
        );

        const Brick = ({ brick, onPointerDown, onPointerMove, dynamic }) => {
            const shade = Math.max(0.55, 1 - (dynamic?.damage || 0) * 0.07);
            const color = new THREE.Color(brick.color).multiplyScalar(shade).getStyle();
            return (
                <group position={[brick.position[0] + (dynamic?.offset?.x || 0), brick.position[1] + (dynamic?.offset?.y || 0), brick.position[2] + (dynamic?.offset?.z || 0)]} rotation={[dynamic?.tilt?.x || 0, brick.rotation + (dynamic?.tilt?.y || 0), dynamic?.tilt?.z || 0]}>
                    <RoundedBox args={[1,1,1]} radius={0.05} smoothness={4} position={[0,0.5,0]} castShadow receiveShadow onPointerDown={onPointerDown} onPointerMove={onPointerMove}>
                        <meshPhysicalMaterial color={color} roughness={0.22} clearcoat={0.45} />
                    </RoundedBox>
                    <mesh position={[0,1.1,0]} castShadow receiveShadow>
                        <cylinderGeometry args={[0.35,0.35,0.2,20]} />
                        <meshPhysicalMaterial color={color} roughness={0.24} clearcoat={0.5} />
                    </mesh>
                </group>
            );
        };

        const snapshot = (bricks) => bricks.map((b) => ({ ...b, position: [...b.position] }));

        const buildMergedGeometry = (bricks) => {
            const all = [];
            bricks.forEach((b) => {
                const transform = new THREE.Matrix4();
                const position = new THREE.Vector3(b.position[0], b.position[1], b.position[2]);
                const quat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, b.rotation || 0, 0));
                transform.compose(position, quat, new THREE.Vector3(1, 1, 1));

                const box = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
                box.translate(0, 0.5, 0);
                box.applyMatrix4(transform);
                all.push(box);

                const stud = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 24).toNonIndexed();
                stud.translate(0, 1.1, 0);
                stud.applyMatrix4(transform);
                all.push(stud);
            });
            if (!all.length) return null;
            const merged = mergeGeometries(all, true);
            const welded = mergeVertices(merged, 1e-4);
            welded.computeVertexNormals();
            return welded;
        };

        function Scene({ app }) {
            const { gl, scene, camera } = useThree();

            useEffect(() => {
                app.setScreenshotExporter(() => {
                    gl.render(scene, camera);
                    const source = gl.domElement;
                    const scale = Math.max(2, Math.ceil(window.devicePixelRatio || 1));
                    const out = document.createElement('canvas');
                    out.width = source.width * scale;
                    out.height = source.height * scale;
                    const ctx = out.getContext('2d');
                    ctx.drawImage(source, 0, 0, out.width, out.height);
                    const link = document.createElement('a');
                    link.href = out.toDataURL('image/png');
                    link.download = 'brickbuilder-screenshot.png';
                    link.click();
                });
            }, [gl, scene, camera]);

            useFrame(() => {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                app.setCameraDirection([dir.x, dir.y, dir.z]);
            });

            const handlePointerMove = (e) => {
                if (app.mode === 'delete') return app.setHover(null);
                const p = e.point;
                let pos;
                if (e.object.geometry.type === 'PlaneGeometry') pos = [Math.round(p.x), 0, Math.round(p.z)];
                else {
                    const n = e.face.normal;
                    pos = [Math.round(p.x + n.x * 0.5), Math.floor(p.y + n.y * 0.5), Math.round(p.z + n.z * 0.5)];
                    pos[1] = Math.max(0, pos[1]);
                }
                app.setHover(pos);
            };

            const addAtHover = () => {
                if (!app.hover) return;
                if (app.bricks.some((b) => b.position.every((v, i) => v === app.hover[i]))) return;
                const next = [...app.bricks, { id: createId(), position: [...app.hover], rotation: app.rotation, color: app.activeColor, material: app.activeMaterial }];
                app.commit(next);
                playImpactSound(app.activeMaterial, app.soundEnabled);
            };

            const moveSelected = () => {
                if (!app.selectedId || !app.hover) return;
                if (app.bricks.some((b) => b.id !== app.selectedId && b.position.every((v, i) => v === app.hover[i]))) return;
                const next = app.bricks.map((b) => b.id === app.selectedId ? ({ ...b, position: [...app.hover] }) : b);
                app.commit(next);
                playImpactSound('wood', app.soundEnabled);
            };

            return (
                <>
                    <ambientLight intensity={0.65} />
                    <directionalLight position={[10, 18, 8]} intensity={1.25} castShadow />
                    <Environment preset="city" blur={0.7} />

                    {app.bricks.map((brick) => (
                        <Brick
                            key={brick.id}
                            brick={brick}
                            dynamic={app.physics[brick.id]}
                            onPointerMove={handlePointerMove}
                            onPointerDown={(e) => {
                                e.stopPropagation();
                                if (app.mode === 'delete') {
                                    app.commit(app.bricks.filter((b) => b.id !== brick.id));
                                    playImpactSound('metal', app.soundEnabled);
                                } else if (app.mode === 'move') {
                                    app.setSelectedId(brick.id);
                                } else {
                                    handlePointerMove(e);
                                    addAtHover();
                                }
                            }}
                        />
                    ))}

                    {app.mode !== 'delete' && app.hover && (
                        <group position={app.hover}>
                            <RoundedBox args={[1,1,1]} radius={0.05} smoothness={3} position={[0,0.5,0]}>
                                <meshStandardMaterial color={app.mode === 'move' ? '#22c55e' : app.activeColor} transparent opacity={0.35} />
                            </RoundedBox>
                        </group>
                    )}

                    <mesh rotation={[-Math.PI/2, 0, 0]} onPointerMove={handlePointerMove} onClick={(e) => { e.stopPropagation(); app.mode === 'move' ? moveSelected() : addAtHover(); }}>
                        <planeGeometry args={[64, 64]} />
                        <meshStandardMaterial transparent opacity={0} />
                    </mesh>
                    <gridHelper args={[GRID_SIZE * 2, GRID_SIZE * 2, 0x6b7280, 0x374151]} position={[0,0.01,0]} />
                    <OrbitControls makeDefault minPolarAngle={0} maxPolarAngle={Math.PI / 2 - 0.05} enableDamping dampingFactor={0.06} />
                </>
            );
        }

        function App() {
            const [bricks, setBricks] = useState([]);
            const [history, setHistory] = useState([[]]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const [hover, setHover] = useState(null);
            const [mode, setMode] = useState('build');
            const [rotation, setRotation] = useState(0);
            const [activeColor, setActiveColor] = useState(PALETTE[0]);
            const [activeMaterial, setActiveMaterial] = useState('plastic');
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [selectedId, setSelectedId] = useState(null);
            const [showOnboarding, setShowOnboarding] = useState(true);
            const [physics, setPhysics] = useState({});
            const [cameraDirection, setCameraDirection] = useState([0.15, 0.3, -0.9]);
            const screenshotRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem('lego-build-v2');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed.bricks)) {
                            setBricks(parsed.bricks);
                            setHistory([snapshot(parsed.bricks)]);
                            setHistoryIndex(0);
                        }
                    } catch {}
                }
                const timer = setTimeout(() => setShowOnboarding(false), 3000);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                let raf;
                const tick = () => {
                    setPhysics((prev) => {
                        const next = {};
                        Object.entries(prev).forEach(([id, s]) => {
                            const vy = s.vy - 0.006;
                            const ox = s.offset.x + s.vx;
                            const oy = Math.max(0, s.offset.y + vy);
                            const oz = s.offset.z + s.vz;
                            const damp = 0.94;
                            const nvx = s.vx * damp;
                            const nvy = oy === 0 ? -vy * 0.42 : vy;
                            const nvz = s.vz * damp;
                            if (Math.abs(nvx) + Math.abs(nvy) + Math.abs(nvz) > 0.002 || oy > 0.001) {
                                next[id] = {
                                    ...s,
                                    vx: nvx,
                                    vy: nvy,
                                    vz: nvz,
                                    offset: { x: ox, y: oy, z: oz },
                                    tilt: { x: s.tilt.x + nvx * 0.2, y: s.tilt.y + nvz * 0.2, z: s.tilt.z + nvx * 0.15 }
                                };
                            }
                        });
                        return next;
                    });
                    raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(raf);
            }, []);

            const commit = (nextBricks) => {
                const snap = snapshot(nextBricks);
                const nextHistory = history.slice(0, historyIndex + 1);
                nextHistory.push(snap);
                setHistory(nextHistory);
                setHistoryIndex(nextHistory.length - 1);
                setBricks(snap);
                setPhysics((prev) => Object.fromEntries(Object.entries(prev).filter(([id]) => snap.some((b) => b.id === id))));
            };

            const undo = () => {
                if (historyIndex <= 0) return;
                const i = historyIndex - 1;
                setHistoryIndex(i);
                setBricks(snapshot(history[i]));
            };

            const redo = () => {
                if (historyIndex >= history.length - 1) return;
                const i = historyIndex + 1;
                setHistoryIndex(i);
                setBricks(snapshot(history[i]));
            };

            const saveProject = () => {
                const payload = { version: 1, savedAt: new Date().toISOString(), bricks: snapshot(bricks) };
                localStorage.setItem('lego-build-v2', JSON.stringify(payload));
                alert('Project saved locally.');
            };

            const reloadProject = () => {
                const raw = localStorage.getItem('lego-build-v2');
                if (!raw) return alert('No saved project found.');
                try {
                    const payload = JSON.parse(raw);
                    if (!Array.isArray(payload.bricks)) return;
                    setBricks(snapshot(payload.bricks));
                    setHistory([snapshot(payload.bricks)]);
                    setHistoryIndex(0);
                } catch {}
            };

            const download = (name, body, type) => {
                const blob = new Blob([body], { type });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
                URL.revokeObjectURL(a.href);
            };

            const exportMesh = (kind) => {
                const merged = buildMergedGeometry(bricks);
                if (!merged) return alert('Nothing to export yet.');
                const mesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial());
                const group = new THREE.Group();
                group.add(mesh);
                if (kind === 'stl') {
                    const stl = new STLExporter().parse(group, { binary: false });
                    download('brickbuilder.stl', stl, 'model/stl');
                } else {
                    const obj = new OBJExporter().parse(group);
                    download('brickbuilder.obj', obj, 'text/plain');
                }
            };

            const punchAll = () => {
                const dir = new THREE.Vector3(cameraDirection[0], Math.max(0.15, Math.abs(cameraDirection[1])), cameraDirection[2]).normalize();
                setPhysics((prev) => {
                    const next = { ...prev };
                    bricks.forEach((b) => {
                        const damage = (next[b.id]?.damage || 0) + 1;
                        const force = 0.06 + damage * 0.008;
                        const jitter = new THREE.Vector3((Math.random() - 0.5) * 0.08, Math.random() * 0.07, (Math.random() - 0.5) * 0.08);
                        const v = dir.clone().multiplyScalar(force).add(jitter);
                        next[b.id] = {
                            damage,
                            vx: v.x,
                            vy: v.y,
                            vz: v.z,
                            offset: next[b.id]?.offset || { x: 0, y: 0, z: 0 },
                            tilt: next[b.id]?.tilt || { x: 0, y: 0, z: 0 }
                        };
                    });
                    return next;
                });
                playImpactSound('metal', soundEnabled, 1.4);
            };

            const app = useMemo(() => ({
                bricks, hover, setHover, mode, rotation, activeColor, activeMaterial,
                selectedId, setSelectedId, physics, soundEnabled, setCameraDirection,
                commit,
                setScreenshotExporter: (fn) => { screenshotRef.current = fn; }
            }), [bricks, hover, mode, rotation, activeColor, activeMaterial, selectedId, physics, soundEnabled]);

            return (
                <div className="w-full h-screen relative overflow-hidden bg-slate-900 text-slate-900">
                    <Canvas shadows dpr={[1, Math.min(3, window.devicePixelRatio || 2)]} gl={{ preserveDrawingBuffer: true }} camera={{ position: [8, 8, 8], fov: 45 }}>
                        <Scene app={app} />
                    </Canvas>

                    {showOnboarding && (
                        <div className="absolute inset-0 bg-slate-900/58 backdrop-blur-[2px] z-40 flex items-center justify-center px-3" onClick={() => setShowOnboarding(false)}>
                            <div className="max-w-md w-full bg-white rounded-2xl p-4 sm:p-6 text-slate-800 shadow-2xl border border-slate-200">
                                <h1 className="text-lg sm:text-xl font-bold flex items-center gap-2 mb-3"><span>{Icons.Start()}</span>Start Building</h1>
                                <div className="grid gap-2 text-sm sm:text-base">
                                    <p>👆 <b>Tap to place</b> on highlighted grid cells.</p>
                                    <p>✋ <b>Drag to orbit</b>; pinch or scroll to zoom.</p>
                                    <p>🧭 Pick <b>Build / Move / Delete</b> from the top toolbar.</p>
                                </div>
                                <button className={`mt-4 w-full ${MIN_TOUCH} rounded-xl bg-blue-600 text-white font-semibold`} onClick={() => setShowOnboarding(false)}>Start Building</button>
                            </div>
                        </div>
                    )}

                    <div className="absolute top-0 left-0 right-0 z-30 p-2 sm:p-3 pointer-events-none">
                        <div className="pointer-events-auto rounded-2xl bg-white/90 backdrop-blur-md p-2 sm:p-3 border border-slate-200">
                            <div className="flex gap-2 items-center overflow-x-auto safe-scroll">
                                <UIButton label="Build" icon={Icons.Build} active={mode === 'build'} onClick={() => { setMode('build'); setSelectedId(null); }} />
                                <UIButton label="Move" icon={Icons.Move} active={mode === 'move'} onClick={() => setMode('move')} />
                                <UIButton label="Delete" icon={Icons.Delete} active={mode === 'delete'} onClick={() => { setMode('delete'); setSelectedId(null); }} />
                                <UIButton label="Rotate" onClick={() => {
                                    if (mode === 'move' && selectedId) {
                                        commit(bricks.map((b) => b.id === selectedId ? ({ ...b, rotation: b.rotation + Math.PI / 2 }) : b));
                                    } else setRotation((r) => r + Math.PI / 2);
                                }} />
                                <UIButton label="Undo" icon={Icons.Undo} onClick={undo} disabled={historyIndex === 0} />
                                <UIButton label="Redo" icon={Icons.Redo} onClick={redo} disabled={historyIndex === history.length - 1} />
                                <UIButton label="Punch All" icon={Icons.Punch} onClick={punchAll} />
                            </div>
                        </div>
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 z-30 p-2 sm:p-3 pointer-events-none">
                        <div className="pointer-events-auto rounded-2xl bg-white/92 backdrop-blur-md p-2 sm:p-3 border border-slate-200 flex flex-col gap-2 max-h-[42vh] overflow-y-auto">
                            <div className="flex gap-2 overflow-x-auto safe-scroll pb-1">
                                {PALETTE.map((c) => (
                                    <button key={c} onClick={() => setActiveColor(c)} className={`${MIN_TOUCH} w-11 h-11 rounded-full border-4 ${activeColor === c ? 'border-blue-500' : 'border-white'} shrink-0`} style={{ backgroundColor: c }} />
                                ))}
                            </div>
                            <div className="flex flex-wrap gap-2 items-center text-sm">
                                <label className="font-semibold">Material:</label>
                                {MATERIAL_TYPES.map((m) => (
                                    <UIButton key={m} label={m} active={activeMaterial === m} onClick={() => setActiveMaterial(m)} />
                                ))}
                                <UIButton label={soundEnabled ? 'Sound: On' : 'Sound: Off'} onClick={() => setSoundEnabled((s) => !s)} />
                                <UIButton label="Save Project" icon={Icons.Save} onClick={saveProject} />
                                <UIButton label="Reload" icon={Icons.Load} onClick={reloadProject} />
                                <UIButton label="Export STL" onClick={() => exportMesh('stl')} />
                                <UIButton label="Export OBJ" onClick={() => exportMesh('obj')} />
                                <UIButton label="Export Screenshot" icon={Icons.Shot} onClick={() => screenshotRef.current?.()} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
